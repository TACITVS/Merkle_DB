# Nginx Load Balancer Configuration for MerkleDB
# Place in /etc/nginx/sites-available/merkledb.conf
# Symlink to /etc/nginx/sites-enabled/merkledb.conf

upstream merkledb_backend {
    # Load balancing method: least_conn is best for long-lived connections
    least_conn;

    # MerkleDB node servers
    server merkledb-node1:4001 max_fails=3 fail_timeout=30s;
    server merkledb-node2:4001 max_fails=3 fail_timeout=30s;
    server merkledb-node3:4001 max_fails=3 fail_timeout=30s;

    # Health check interval (requires nginx plus or use separate module)
    # check interval=3000 rise=2 fall=3 timeout=1000;

    # Keep-alive connections to backend
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=50r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name merkledb.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name merkledb.example.com;

    # SSL certificates (use Let's Encrypt or your own)
    ssl_certificate /etc/ssl/certs/merkledb.crt;
    ssl_certificate_key /etc/ssl/private/merkledb.key;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size limit (for vector uploads)
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Connection limits (max 10 connections per IP)
    limit_conn conn_limit 10;

    # Access logs
    access_log /var/log/nginx/merkledb_access.log combined;
    error_log /var/log/nginx/merkledb_error.log warn;

    # Health check endpoint (no auth required)
    location /health {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://merkledb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Metrics endpoint (restrict to monitoring network)
    location /metrics {
        # allow 10.0.0.0/8;  # Internal network
        # deny all;
        proxy_pass http://merkledb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Search endpoint (higher rate limit)
    location /search {
        limit_req zone=search_limit burst=10 nodelay;
        proxy_pass http://merkledb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Insert/upsert endpoints (lower rate limit)
    location ~ ^/(insert|upsert|batch) {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://merkledb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API endpoints
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://merkledb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers (if needed)
        # add_header Access-Control-Allow-Origin "*" always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }
}
