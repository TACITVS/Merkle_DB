version: '3.8'

services:
  # MerkleDB Node 1
  merkledb-node1:
    image: merkledb:${VERSION:-latest}
    container_name: merkledb-node1
    hostname: merkledb-node1
    restart: unless-stopped
    environment:
      - RELEASE_NODE=merkledb@merkledb-node1
      - RELEASE_COOKIE=${RELEASE_COOKIE:-merkledb_secret_cookie}
      - MERKLEDB_PORT=4001
      - MERKLEDB_REQUIRE_AUTH=true
      - RAFT_ELECTION_TIMEOUT_MIN=1000
      - RAFT_ELECTION_TIMEOUT_MAX=2000
    ports:
      - "4001:4001"
    volumes:
      - merkledb-node1-data:/opt/merkledb/data
      - merkledb-node1-logs:/var/log/merkledb
    networks:
      - merkledb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MerkleDB Node 2
  merkledb-node2:
    image: merkledb:${VERSION:-latest}
    container_name: merkledb-node2
    hostname: merkledb-node2
    restart: unless-stopped
    environment:
      - RELEASE_NODE=merkledb@merkledb-node2
      - RELEASE_COOKIE=${RELEASE_COOKIE:-merkledb_secret_cookie}
      - MERKLEDB_PORT=4001
      - MERKLEDB_REQUIRE_AUTH=true
    ports:
      - "4002:4001"
    volumes:
      - merkledb-node2-data:/opt/merkledb/data
      - merkledb-node2-logs:/var/log/merkledb
    networks:
      - merkledb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MerkleDB Node 3
  merkledb-node3:
    image: merkledb:${VERSION:-latest}
    container_name: merkledb-node3
    hostname: merkledb-node3
    restart: unless-stopped
    environment:
      - RELEASE_NODE=merkledb@merkledb-node3
      - RELEASE_COOKIE=${RELEASE_COOKIE:-merkledb_secret_cookie}
      - MERKLEDB_PORT=4001
      - MERKLEDB_REQUIRE_AUTH=true
    ports:
      - "4003:4001"
    volumes:
      - merkledb-node3-data:/opt/merkledb/data
      - merkledb-node3-logs:/var/log/merkledb
    networks:
      - merkledb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: merkledb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/merkledb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/ssl:ro
    networks:
      - merkledb-network
    depends_on:
      - merkledb-node1
      - merkledb-node2
      - merkledb-node3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: merkledb-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - merkledb-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: merkledb-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - merkledb-network
    depends_on:
      - prometheus

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: merkledb-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - merkledb-network

volumes:
  merkledb-node1-data:
  merkledb-node1-logs:
  merkledb-node2-data:
  merkledb-node2-logs:
  merkledb-node3-data:
  merkledb-node3-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  merkledb-network:
    driver: bridge
